<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff7e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>もじもじ たんけん</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ホーム画面：子どもが「ひらがな」か「カタカナ」を選ぶ -->
  <section id="screen-home" class="screen active">
    <h1 class="logo">もじもじ<br>たんけん</h1>
    <div class="home-buttons">
      <button class="big-choice hira" data-script="hira" aria-label="ひらがな">
        <span class="big-char">あ</span><span class="label">ひらがな</span>
      </button>
      <button class="big-choice kata" data-script="kata" aria-label="カタカナ">
        <span class="big-char">ア</span><span class="label">カタカナ</span>
      </button>
    </div>
    <p class="credit">かきじゅんデータ：<a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">KanjiVG</a>（CC BY-SA 3.0）</p>
  </section>

  <!-- もじ一覧画面：子どもが練習する文字を選ぶ -->
  <section id="screen-list" class="screen">
    <header class="bar">
      <button class="icon-btn" id="list-back" aria-label="もどる">🏠</button>
      <h2 id="list-title"></h2>
      <span class="bar-space"></span>
    </header>
    <div id="kana-grid" class="kana-grid"></div>
  </section>

  <!-- れんしゅう画面：子どもが書き順を見て、なぞって、ひとりで書く -->
  <section id="screen-practice" class="screen">
    <header class="bar">
      <button class="icon-btn" id="practice-back" aria-label="もどる">◀</button>
      <button class="icon-btn" id="practice-speak" aria-label="よみをきく">🔊</button>
      <button class="icon-btn" id="practice-next" aria-label="つぎのもじ">▶</button>
    </header>
    <div class="practice-body">
      <div class="board-wrap">
        <ol class="steps" aria-hidden="true">
          <li data-step="watch">👀</li>
          <li data-step="trace">✏️</li>
          <li data-step="alone">🖐️</li>
          <li data-step="done">⭐</li>
        </ol>
        <svg id="board" viewBox="0 0 109 109" aria-label="かくところ">
          <rect class="frame" x="1" y="1" width="107" height="107" rx="6"/>
          <line class="cross" x1="54.5" y1="4" x2="54.5" y2="105"/>
          <line class="cross" x1="4" y1="54.5" x2="105" y2="54.5"/>
          <g id="layer-guide"></g>
          <g id="layer-done"></g>
          <g id="layer-anim"></g>
          <g id="layer-ink"></g>
          <g id="layer-hint"></g>
        </svg>
      </div>
      <div id="words" class="words"></div>
      <div id="after-buttons" class="after-buttons">
        <button class="round-btn again" id="btn-again" aria-label="もういちど">↻</button>
        <button class="round-btn next" id="btn-next" aria-label="つぎのもじ">▶</button>
      </div>
    </div>
    <div id="celebrate" class="celebrate" aria-hidden="true"></div>
  </section>

  <script src="js/strokes.js"></script>
  <script src="js/words.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
